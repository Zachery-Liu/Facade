name: Feature request (English)
description: Propose an improvement or new capability for Facade
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement.

        Please describe the underlying problem before proposing an implementation.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem or limitation are you trying to solve?
      placeholder: "When using Facade to ..., it is difficult to ..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What would you like Facade to do?
      placeholder: "Facade could ..."
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: Example
      description: Show an example CLI command, configuration, generated output, or workflow if useful.
      placeholder: |
        facade build

        # or

        schema: 1

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI
        - Release metadata
        - Asset classification
        - Generated website
        - Agent-facing outputs
        - GitHub Action
        - Configuration
        - Documentation
        - Developer experience
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any workaround or alternative approach you have considered.

  - type: checkboxes
    id: boundaries
    attributes:
      label: Scope considerations
      description: These are informational, not requirements for submitting a proposal.
      options:
        - label: This request does not require Facade to proxy software downloads.
        - label: This request does not require Facade to automatically install software for users.
        - label: This request does not require Facade to make trust decisions on behalf of users.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find an equivalent request.
          required: true
