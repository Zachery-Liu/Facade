name: Bug 报告 (简体中文)
description: 报告 Facade 中可复现的错误行为
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        感谢你报告问题。

        请提供足够的信息，使其他人能够复现问题。
        请不要提交凭证、Token、私有仓库内容或其他敏感信息。

  - type: textarea
    id: description
    attributes:
      label: 发生了什么？
      description: 请描述实际发生的问题，以及你原本期望 Facade 如何表现。
      placeholder: |
        我原本期望 ...
        实际结果是 ...
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 请尽量提供最小且可复现的操作步骤。
      placeholder: |
        1. 执行 ...
        2. 配置 ...
        3. 观察到 ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Facade 版本或 commit
      description: 如果可以，请填写 Release 版本或 commit SHA。
      placeholder: "v0.1.0 或 abc1234"

  - type: input
    id: command
    attributes:
      label: 执行的命令
      description: 如果问题涉及 CLI，请提供你执行的命令。
      placeholder: "facade build"

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Linux
        - macOS
        - Windows
        - 其他 / 不适用
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js 版本
      placeholder: "22.x"

  - type: input
    id: package_manager
    attributes:
      label: 包管理器
      placeholder: "pnpm 11.19.0"

  - type: textarea
    id: logs
    attributes:
      label: 相关输出或日志
      description: 请移除 Token、凭证、私有 URL 和其他敏感信息。
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: 其他上下文
      description: 可以补充截图、示例配置、Release 资源文件名或其他有用信息。

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已经搜索已有 Issue，未发现相同问题。
          required: true
        - label: 我已经从报告中移除密钥和其他敏感信息。
          required: true
