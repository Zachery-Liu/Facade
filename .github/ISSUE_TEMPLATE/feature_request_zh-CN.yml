name: 功能建议 (简体中文)
description: 为 Facade 提议改进或新的能力
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        感谢你提出改进建议。

        请先描述你想解决的实际问题，再描述你期望的实现方式。

  - type: textarea
    id: problem
    attributes:
      label: 问题
      description: 你想解决什么问题或限制？
      placeholder: "当我使用 Facade 来 ... 时，目前很难 ..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望行为
      description: 你希望 Facade 增加或改变什么行为？
      placeholder: "Facade 可以 ..."
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: 示例
      description: 如果有帮助，可以提供 CLI 命令、配置、生成结果或工作流示例。
      placeholder: |
        facade build

        # 或

        schema: 1

  - type: dropdown
    id: area
    attributes:
      label: 涉及区域
      options:
        - CLI
        - Release 元数据
        - 资源分类
        - 生成的网站
        - 面向 Agent 的输出
        - GitHub Action
        - 配置
        - 文档
        - 开发者体验
        - 其他
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 如果你尝试过临时方案或考虑过其他设计，请在这里说明。

  - type: checkboxes
    id: boundaries
    attributes:
      label: 范围考虑
      description: 以下内容用于帮助理解提案，不是提交功能建议的强制条件。
      options:
        - label: 这个建议不要求 Facade 代理软件下载。
        - label: 这个建议不要求 Facade 自动替用户安装软件。
        - label: 这个建议不要求 Facade 替用户作出信任决策。

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已经搜索已有 Issue，未发现等价的功能建议。
          required: true
