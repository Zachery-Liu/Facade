<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="title desc">
  <title id="title">Facade roadmap</title>
  <desc id="desc">Facade roadmap from v0.1 foundation through distribution intelligence, build-aware portable protocol, compatibility guarantee, and an open ecosystem.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#15103a"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.52" stop-color="#4f7cff"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="cardStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0.58"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientTransform="translate(120 120) rotate(35) scale(540 330)">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientTransform="translate(1500 580) rotate(210) scale(520 300)">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="640" rx="30" fill="url(#bg)"/>
  <rect width="1600" height="640" rx="30" fill="url(#glowA)"/>
  <rect width="1600" height="640" rx="30" fill="url(#glowB)"/>

  <g opacity="0.12" stroke="#8fb6ff" fill="none">
    <circle cx="145" cy="110" r="260"/>
    <circle cx="145" cy="110" r="400"/>
    <circle cx="1440" cy="530" r="280"/>
    <circle cx="1440" cy="530" r="430"/>
  </g>

  <line x1="115" y1="145" x2="1485" y2="145" stroke="url(#line)" stroke-width="3"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <g font-size="28" font-weight="700" fill="#8cc7ff">
      <text x="110" y="104">v0.1</text>
      <text x="405" y="104">v0.2</text>
      <text x="708" y="104">v0.3</text>
      <text x="1012" y="104">v1.0</text>
      <text x="1352" y="104">Future</text>
    </g>

    <g fill="#0d1a2c" stroke-width="3">
      <circle cx="138" cy="145" r="14" stroke="#69c6ff" filter="url(#softGlow)"/>
      <circle cx="435" cy="145" r="14" stroke="#55a7ff" filter="url(#softGlow)"/>
      <circle cx="738" cy="145" r="14" stroke="#6677ff" filter="url(#softGlow)"/>
      <circle cx="1042" cy="145" r="14" stroke="#8059ff" filter="url(#softGlow)"/>
      <circle cx="1382" cy="145" r="14" stroke="#a855f7" filter="url(#softGlow)"/>
    </g>

    <g fill="#0b1626" fill-opacity="0.84" stroke="url(#cardStroke)" stroke-width="1.4">
      <rect x="70" y="185" width="270" height="290" rx="20"/>
      <rect x="365" y="185" width="270" height="290" rx="20"/>
      <rect x="660" y="185" width="270" height="290" rx="20"/>
      <rect x="955" y="185" width="270" height="290" rx="20"/>
      <rect x="1250" y="185" width="280" height="290" rx="20"/>
    </g>

    <g fill="#f4f7ff" font-size="26" font-weight="720">
      <text x="98" y="240">Foundation</text>
      <text x="393" y="240">Distribution</text>
      <text x="393" y="274">Intelligence</text>
      <text x="688" y="240">Build-Aware +</text>
      <text x="688" y="274">Portable Protocol</text>
      <text x="983" y="240">Compatibility</text>
      <text x="983" y="274">Guarantee</text>
      <text x="1278" y="240">Open Ecosystem</text>
    </g>

    <g fill="#a9b9d0" font-size="19" font-weight="450">
      <text x="98" y="315">GitHub source</text>
      <text x="98" y="350">classifier + overrides</text>
      <text x="98" y="385">shared selector</text>
      <text x="98" y="420">manifest + Agent interface</text>
      <text x="98" y="455">release page + Action</text>

      <text x="393" y="315">environment model</text>
      <text x="393" y="350">compatibility + policy</text>
      <text x="393" y="385">release diagnostics</text>
      <text x="393" y="420">channels + release graph</text>
      <text x="393" y="455">richer metadata</text>

      <text x="688" y="315">build-time declarations</text>
      <text x="688" y="350">artifact inspection</text>
      <text x="688" y="385">artifact identity</text>
      <text x="688" y="420">portable manifest</text>
      <text x="688" y="455">portable resolver</text>

      <text x="983" y="315">stable schema</text>
      <text x="983" y="350">discovery + freshness</text>
      <text x="983" y="385">threat model</text>
      <text x="983" y="420">conformance suite</text>
      <text x="983" y="455">compatibility promise</text>

      <text x="1278" y="315">federated registry</text>
      <text x="1278" y="350">catalog + Agent registry</text>
      <text x="1278" y="385">third-party producers</text>
      <text x="1278" y="420">open integrations</text>
      <text x="1278" y="455">optional store-like UX</text>
    </g>

    <rect x="435" y="520" width="730" height="62" rx="31" fill="#0a1730" fill-opacity="0.9" stroke="#2f6edb" stroke-opacity="0.55"/>
    <circle cx="480" cy="551" r="11" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="480" cy="551" r="4" fill="#38bdf8"/>
    <text x="510" y="558" fill="#58a6ff" font-size="20" font-weight="700">Current focus:</text>
    <text x="655" y="558" fill="#9fb0c7" font-size="20">build the distribution metadata layer first.</text>
  </g>
</svg>
